name: shorturl

# Local development only: MongoDB is reachable inside this Compose network.
x-mongo: &mongo
  image: mongo:8.0
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  mongo1:
    <<: *mongo
    volumes:
      - mongo1-data:/data/db

  mongo2:
    <<: *mongo
    volumes:
      - mongo2-data:/data/db

  mongo3:
    <<: *mongo
    volumes:
      - mongo3-data:/data/db

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./docker/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: ["mongosh", "mongodb://mongo1:27017/?directConnection=true", "--quiet", "/init-replica-set.js"]
    restart: "no"

  api:
    build: .
    deploy:
      replicas: 3
    environment:
      MONGODB_URI: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&serverSelectionTimeoutMS=2000&connectTimeoutMS=2000&timeoutMS=3000"
      MONGODB_DATABASE: shorturl
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  k6:
    image: grafana/k6:1.8.2
    profiles: ["loadtest"]
    volumes:
      - ./load-tests:/scripts:ro
      - ./load-tests/results:/results
    environment:
      BASE_URL: http://nginx

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
