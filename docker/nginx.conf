log_format upstream '$remote_addr "$request" status=$status '
                    'upstream=$upstream_addr upstream_status=$upstream_status';

upstream shorturl_api {
    zone shorturl_api 64k;
    # Re-resolve Docker's service name when replicas are replaced or scaled.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location / {
        proxy_pass http://shorturl_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 2s;
        # Keep the default protection against replaying POSTs already sent upstream.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }
}
